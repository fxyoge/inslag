name: Windows E2E diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: stable
  RUST_BACKTRACE: full
  # Native crashes need symbols, but full workspace debug info can exhaust runner disk.
  CARGO_PROFILE_DEV_DEBUG: 1
  CARGO_PROFILE_TEST_DEBUG: 1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      run: rustup toolchain install stable --profile minimal --no-self-update
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: windows-e2e-diagnostics
        cache-on-failure: true
    - name: Record runner environment
      run: |
        New-Item -ItemType Directory -Force diagnostics | Out-Null
        & {
          "commit=$env:GITHUB_SHA"
          "ref=$env:GITHUB_REF"
          "image=$env:ImageOS $env:ImageVersion"
          rustc -vV
          cargo -vV
          $PSVersionTable | Format-List
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, OSArchitecture
          Get-CimInstance Win32_SoundDevice | Format-List Name, Status, Manufacturer
          Get-PSDrive -PSProvider FileSystem | Format-Table
        } 2>&1 | Tee-Object diagnostics/environment.log
    - name: Build the CI test binaries with symbols
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        cargo test --timings --locked --workspace --all-features --no-run --message-format=json > diagnostics/build.jsonl 2> diagnostics/build.log
        $code = $LASTEXITCODE
        Get-Content diagnostics/build.log
        if ($code -ne 0) { exit $code }
        $artifacts = Get-Content diagnostics/build.jsonl | ForEach-Object { $_ | ConvertFrom-Json }
        $tests = @($artifacts | Where-Object {
          $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'inslag_e2e' -and $_.profile.test -and $_.executable
        })
        if ($tests.Count -ne 1) { throw "Expected one inslag_e2e test executable, found $($tests.Count)" }
        $exe = $tests[0].executable
        "E2E_TEST_EXE=$exe" >> $env:GITHUB_ENV
        New-Item -ItemType Directory -Force diagnostics/symbols | Out-Null
        Copy-Item $exe diagnostics/symbols
        Copy-Item ([System.IO.Path]::ChangeExtension($exe, '.pdb')) diagnostics/symbols
    - name: Enable native crash dumps
      run: |
        $dumps = New-Item -ItemType Directory -Force diagnostics/dumps
        $name = Split-Path $env:E2E_TEST_EXE -Leaf
        $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$name"
        New-Item -Path $key -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpFolder -Value $dumps.FullName -PropertyType ExpandString -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpCount -Value 3 -PropertyType DWord -Force | Out-Null
        Get-ItemProperty $key | Format-List | Out-File diagnostics/dump-settings.log
    - name: Run E2E tests in parallel
      id: parallel
      continue-on-error: true
      timeout-minutes: 5
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        & $env:E2E_TEST_EXE --nocapture 2>&1 | Tee-Object diagnostics/parallel.log
        $code = $LASTEXITCODE
        "exit_code=$code" | Tee-Object -Append diagnostics/parallel.log
        exit $code
    - name: Run E2E tests serially
      id: serial
      if: ${{ !cancelled() && steps.parallel.outcome != 'skipped' }}
      continue-on-error: true
      timeout-minutes: 5
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        & $env:E2E_TEST_EXE --nocapture --test-threads=1 2>&1 | Tee-Object diagnostics/serial.log
        $code = $LASTEXITCODE
        "exit_code=$code" | Tee-Object -Append diagnostics/serial.log
        exit $code
    - name: Run the headless scenario in isolation
      id: isolated
      if: ${{ !cancelled() && steps.parallel.outcome != 'skipped' }}
      continue-on-error: true
      timeout-minutes: 5
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        & $env:E2E_TEST_EXE --exact tests::suite_runs_a_headless_luau_scenario_and_writes_a_report --nocapture 2>&1 | Tee-Object diagnostics/isolated.log
        $code = $LASTEXITCODE
        "exit_code=$code" | Tee-Object -Append diagnostics/isolated.log
        exit $code
    - name: Collect Windows crash events
      if: always()
      run: |
        Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddHours(-1) } -ErrorAction SilentlyContinue |
          Where-Object { $_.ProviderName -in 'Application Error', 'Windows Error Reporting' } |
          Format-List TimeCreated, ProviderName, Id, Message |
          Out-File diagnostics/windows-events.log
    - name: Analyze native dumps when CDB is available
      if: ${{ !cancelled() && steps.parallel.outcome != 'skipped' }}
      continue-on-error: true
      timeout-minutes: 5
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
        if (!(Test-Path $cdb)) {
          'CDB is not installed; download the dumps and matching symbols for WinDbg.' | Tee-Object diagnostics/debugger.log
          exit 0
        }
        $symbols = (Resolve-Path diagnostics/symbols).Path
        $symbolCache = Join-Path $env:RUNNER_TEMP symbols
        Get-ChildItem diagnostics/dumps -Filter '*.dmp' | ForEach-Object {
          & $cdb -z $_.FullName -y "$symbols;srv*$symbolCache*https://msdl.microsoft.com/download/symbols" -c '!analyze -v; .ecxr; kv; ~* kb; lm; q' 2>&1 |
            Tee-Object "diagnostics/$($_.BaseName)-stack.log"
        }
    - name: Upload diagnostic logs and reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows-e2e-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          diagnostics/*.log
          diagnostics/*.jsonl
          target/e2e/**/report.json
          target/cargo-timings/*.html
        if-no-files-found: warn
        retention-days: 7
    - name: Upload native dumps and matching symbols
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows-e2e-dumps-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          diagnostics/dumps
          diagnostics/symbols
        if-no-files-found: warn
        retention-days: 7
    - name: Report diagnostic test failures
      if: ${{ !cancelled() && (steps.parallel.outcome == 'failure' || steps.serial.outcome == 'failure' || steps.isolated.outcome == 'failure') }}
      run: throw 'E2E diagnostics reproduced a failure; inspect the uploaded logs and dumps.'
