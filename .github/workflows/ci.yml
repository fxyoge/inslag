name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
    - name: Check formatting
      run: cargo fmt --all -- --check

  test:
    name: Workspace (${{ matrix.os }}, Rust ${{ matrix.rust }}, ${{ matrix.features }} features)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          rust: stable
          features: default
          clippy: true
          docs: false
        - os: ubuntu-latest
          rust: stable
          features: all
          clippy: true
          docs: true
        - os: ubuntu-latest
          rust: '1.97.1'
          features: all
          clippy: false
          docs: false
        # - os: windows-latest
        #   rust: stable
        #   features: all
        #   clippy: false
        #   docs: false
        - os: macos-latest
          rust: stable
          features: all
          clippy: false
          docs: false
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTDOCFLAGS: -D warnings
      # Full Bevy debug artifacts can exhaust the hosted runner's disk during linking.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
    - name: Install Clippy
      if: matrix.clippy
      run: rustup component add clippy --toolchain "$RUSTUP_TOOLCHAIN"
    - name: Install audio dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: test-${{ matrix.features }}
        cache-on-failure: true
    - name: Clippy
      if: matrix.clippy
      run: cargo clippy --timings --locked --workspace --all-targets ${{ matrix.features == 'all' && '--all-features' || '' }} -- -D warnings
    - name: Run tests and doctests
      run: cargo test --timings --locked --workspace ${{ matrix.features == 'all' && '--all-features' || '' }}
    - name: Smoke-test benchmarks
      run: cargo test --timings --locked --workspace ${{ matrix.features == 'all' && '--all-features' || '' }}
    - name: Build documentation
      if: matrix.docs
      run: cargo doc --timings --locked --workspace --no-deps --all-features
    - name: Report runner resources on failure
      if: failure() && runner.os == 'Linux'
      run: |
        df -h
        free -h
        if [[ -d target ]]; then
          du -sh target
        fi
    - name: Upload build timings
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: timings-${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.features }}
        path: target/cargo-timings/*.html
        if-no-files-found: ignore

  dylint:
    name: Dylint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      run: rustup show active-toolchain
    - name: Install audio dependencies
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: dylint
        cache-on-failure: true
    - name: Install dylint
      run: cargo install cargo-dylint dylint-link --version 6.3.2 --locked
    - name: Check lint formatting
      working-directory: lints
      run: cargo fmt --all --check
    - name: Clippy for lints
      working-directory: lints
      run: cargo clippy --locked --lib --tests -- -D warnings
    - name: Test lints
      working-directory: lints
      run: cargo test --locked --lib
    - name: Dylint
      working-directory: .
      run: cargo dylint --all --fail-on-no-libraries -- --timings --workspace --all-targets --locked --config 'build.rustflags=["-Dwarnings","-Zalways-encode-mir"]'
    - name: Upload build timings
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: timings-dylint
        path: target/**/cargo-timings/*.html
        if-no-files-found: ignore
