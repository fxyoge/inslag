name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: '2026.11.10'
        install_args: rust
        cache: false
    - name: Check formatting
      run: mise run lint:fmt

  test:
    name: Workspace (${{ matrix.os }}, Rust ${{ matrix.rust }}, ${{ matrix.features }} features)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          rust: stable
          features: default
          clippy: true
          docs: false
        - os: ubuntu-latest
          rust: stable
          features: all
          clippy: true
          docs: true
        - os: ubuntu-latest
          rust: msrv
          features: all
          clippy: false
          docs: false
        # - os: windows-latest
        #   rust: stable
        #   features: all
        #   clippy: false
        #   docs: false
        - os: macos-latest
          rust: stable
          features: all
          clippy: false
          docs: false
    env:
      RUSTDOCFLAGS: -D warnings
      # Full Bevy debug artifacts can exhaust the hosted runner's disk during linking.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: '2026.11.10'
        mise_env: ${{ matrix.rust == 'msrv' && 'msrv' || '' }}
        install_args: rust
        cache: false
    - name: Install audio dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: test-${{ matrix.features }}
        cmd-format: mise exec -- {0}
        cache-on-failure: true
    - name: Clippy
      if: matrix.clippy
      run: mise run lint:clippy --timings ${{ matrix.features == 'all' && '--all-features' || '' }}
    - name: Run tests and doctests
      run: mise run test:workspace --timings ${{ matrix.features == 'all' && '--all-features' || '' }}
    - name: Smoke-test benchmarks
      run: mise run test:workspace --timings ${{ matrix.features == 'all' && '--all-features' || '' }}
    - name: Build documentation
      if: matrix.docs
      run: mise run docs:workspace --timings --all-features
    - name: Report runner resources on failure
      if: failure() && runner.os == 'Linux'
      run: |
        df -h
        free -h
        if [[ -d target ]]; then
          du -sh target
        fi
    - name: Upload build timings
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: timings-${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.features }}
        path: target/cargo-timings/*.html
        if-no-files-found: ignore

  dylint:
    name: Dylint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: '2026.11.10'
        install_args: rust
        cache: false
    - name: Install the lint toolchain
      run: mise run lint:toolchain
    - name: Install audio dependencies
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: dylint-${{ hashFiles('mise.toml') }}
        cmd-format: mise exec -- {0}
        cache-on-failure: true
        cache-directories: |
          ~/.local/share/mise/installs/cargo-cargo-dylint
          ~/.local/share/mise/installs/cargo-dylint-link
    - name: Check lint formatting and Clippy
      run: mise run lint:lints
    - name: Test lints
      run: mise run test:lints
    - name: Dylint
      run: mise run lint:dylint --timings
    - name: Upload build timings
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: timings-dylint
        path: target/**/cargo-timings/*.html
        if-no-files-found: ignore
