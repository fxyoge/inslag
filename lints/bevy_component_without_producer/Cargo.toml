[package]
name = "bevy_component_without_producer"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Detect Bevy components queried without a known producer"

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting.workspace = true

[dev-dependencies]
dylint_testing.workspace = true
bevy_app = { version = "0.20.0", default-features = false }
bevy_ecs = { version = "0.20.0", default-features = false }
bevy_scene = { version = "0.20.0", default-features = false }
bevy_reflect = { version = "0.20.0", default-features = false }

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
