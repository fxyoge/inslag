[workspace]
members = [
    "bevy_enforce_inslag_audio",
    "bevy_enforce_bevy_enhanced_input",
    "bevy_indirect_system_registration",
    "bevy_component_without_producer",
    "unchained_builder",
    "discarded_projection_work",
    "inslag_state_tree_private_access",
    "inslag_state_tree_redundant_effect_forwarding",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dylint_linting = "6.3.2"
dylint_testing = "6.3.2"
bevy_app = { version = "0.19.1", default-features = false }
bevy_ecs = { version = "0.19.1", default-features = false }
bevy_input = { version = "0.19.1", default-features = false, features = ["std", "keyboard", "mouse", "gamepad"] }

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(dylint_lib, values(any()))']
