[package]
name = "bevy_enforce_inslag_audio"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Require inslag_audio instead of raw audio playback in production code"

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting.workspace = true

[dev-dependencies]
dylint_testing.workspace = true
bevy_app = "=0.20.1"
bevy_asset = "=0.20.1"
bevy_audio = { version = "=0.20.1", features = ["wav"] }
bevy_ecs = "=0.20.1"
rodio = { version = "0.22", default-features = false }

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
