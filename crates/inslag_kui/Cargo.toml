[package]
name = "inslag_kui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Asset-backed declarative KUI interfaces for Bevy"
repository.workspace = true
license = "MIT OR Apache-2.0"

[features]
default = []
persistence = ["inslag_state_tree/persistence"]
aseprite = ["dep:bevy_aseprite_ultra"]

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_asset", "bevy_ui", "bevy_ui_widgets", "ui_picking", "bevy_sprite", "sprite_picking", "bevy_picking", "bevy_log", "ghost_nodes"] }
bevy_flair.workspace = true
bevy_aseprite_ultra = { workspace = true, optional = true }
inslag_state_tree.workspace = true
inslag_luau.workspace = true
quick-xml.workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["default_app", "2d_bevy_render", "ui_bevy_render", "bevy_winit", "default_font", "png", "x11", "multi_threaded"] }
divan.workspace = true

[[bench]]
name = "execution"
harness = false

[[bench]]
name = "allocation"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
too_many_arguments = "allow"
