[workspace]
members = ["crates/*"]
exclude = ["lints"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/fxyoge/inslag"

[workspace.dependencies]
inslag_asset_pipeline = { version = "0.1.0", path = "crates/inslag_asset_pipeline" }
inslag_asset_image = { version = "0.1.0", path = "crates/inslag_asset_image" }
inslag_asset_blender = { version = "0.1.0", path = "crates/inslag_asset_blender" }
inslag_asset_aseprite = { version = "0.1.0", path = "crates/inslag_asset_aseprite" }
inslag_asset_svg = { version = "0.1.0", path = "crates/inslag_asset_svg" }
inslag_asset_kui = { version = "0.1.0", path = "crates/inslag_asset_kui" }
inslag_audio = { version = "0.1.0", path = "crates/inslag_audio", default-features = false }
inslag_e2e = { version = "0.1.0", path = "crates/inslag_e2e" }
inslag_e2e_build = { version = "0.1.0", path = "crates/inslag_e2e_build" }
inslag_kui = { version = "0.1.0", path = "crates/inslag_kui" }
inslag_format_loot = { version = "0.1.0", path = "crates/inslag_format_loot" }
inslag_loot_macros = { version = "0.1.0", path = "crates/inslag_loot_macros" }
inslag_persist = { version = "0.1.0", path = "crates/inslag_persist" }
inslag_persist_macros = { version = "0.1.0", path = "crates/inslag_persist_macros" }
inslag_luau = { version = "0.1.0", path = "crates/inslag_luau" }
inslag_state_tree = { version = "0.1.0", path = "crates/inslag_state_tree" }
inslag_state_tree_macros = { version = "0.1.0", path = "crates/inslag_state_tree_macros" }
winnow = "1.0"
proptest = { version = "1", default-features = false, features = ["std"] }
bevy_app = "0.20.0"
bevy_asset = "0.20.0"
bevy_audio = "0.20.0"
bevy_ecs = { version = "0.20.0", features = ["multi_threaded"] }
bevy_reflect = "0.20.0"
bevy_tasks = "0.20.0"
bevy_transform = "0.20.0"
bevy_time = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_utils = "0.20.0"
inventory = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
fastrand = "2"
thiserror = "2.0"
divan = "0.1.21"
tempfile = "3"
toml = "0.8"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
proc-macro-crate = "3"
full_moon = { version = "2.2.0", features = ["luau"] }
mlua = { version = "0.11", features = ["luau", "vendored"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
quick-xml = "0.41"
bevy = { version = "0.20.0", default-features = false }
bevy_flair = { git = "https://github.com/fxyoge/bevy_flair.git", rev = "b9d7b2c5a4efc26820add8a548da37c3eb6d34cd", features = ["ghost_nodes"] }
bevy_aseprite_ultra = "0.10.0"
arboard = { version = "3", default-features = false }
bevy_enhanced_input = { version = "0.27", default-features = false }
rodio = { version = "0.22", default-features = false }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values("bevy_enforce_bevy_enhanced_input", "inslag_state_tree_private_access"))'] }

[workspace.lints.clippy]
all = "warn"

[workspace.metadata.dylint]
libraries = [
    { path = "lints", pattern = "*" },
    { git = "https://github.com/trailofbits/dylint", tag = "v6.3.2", pattern = "examples/general/basic_dead_store" },
    { git = "https://github.com/trailofbits/dylint", tag = "v6.3.2", pattern = "examples/general/crate_wide_allow" },
    { git = "https://github.com/trailofbits/dylint", tag = "v6.3.2", pattern = "examples/restriction/non_topologically_sorted_functions" },
]
